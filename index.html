function renderTask(q){

 if(q.type==='match'){let used=Object.values(assignments);let right=q.pairs.map(p=>p[1]).slice().reverse();return `<div class="match-board"><div class="match-left">${q.pairs.map((p,i)=>`<div class="match-row"><div class="match-source">${esc(p[0])}</div><button class="match-slot ${assignments[i]?'filled':''}" data-slot="${i}" aria-label="Abbina a ${esc(p[0])}">${assignments[i]?esc(assignments[i]):'Tocca qui +'}</button></div>`).join('')}</div><div class="match-right"><div class="bank-title">🗂️ Schede da abbinare</div><div class="chip-bank">${right.map(r=>`<button class="chip ${selection===r?'active':''} ${used.includes(r)?'used':''}" data-chip="${esc(r)}" draggable="${!used.includes(r)}" ${used.includes(r)?'disabled':''} aria-pressed="${selection===r}">${esc(r)}</button>`).join('')}</div><div class="hint-tap">Tocca una scheda e poi lo spazio corretto (oppure trascina).</div></div></div>`}
 if(q.type==='fill'){let used=Object.values(assignments);return `<div class="fill-sentence">${q.parts.map((part,i)=>`${esc(part)}${i<q.answers.length?`<button class="blank ${assignments[i]?'filled':''}" data-slot="${i}" aria-label="Parola mancante ${i+1}">${assignments[i]?esc(assignments[i]):'________'}</button>`:''}`).join('')}</div><div class="match-right" style="margin-top:16px"><div class="bank-title">Parole a disposizione</div><div class="chip-bank">${q.bank.map(t=>`<button class="chip ${selection===t?'active':''} ${used.includes(t)?'used':''}" data-chip="${esc(t)}" draggable="${!used.includes(t)}" ${used.includes(t)?'disabled':''}>${esc(t)}</button>`).join('')}</div></div>`}
 if(q.type==='sequence')return `<div class="sort-list">${sequence.map((id,i)=>{let label=q.items.find(x=>x[0]===id)[1];return `<div class="sort-item"><div class="sort-index">${i+1}</div><span class="sort-label">${esc(label)}</span><div class="sort-controls"><button data-move="${i}:-1" aria-label="Sposta verso l’alto: ${esc(label)}" ${i===0?'disabled':''}>▲</button><button data-move="${i}:1" aria-label="Sposta verso il basso: ${esc(label)}" ${i===sequence.length-1?'disabled':''}>▼</button></div></div>`}).join('')}</div>`;

function setupDrop(q){if(!['match','fill'].includes(q.type))return;document.querySelectorAll('[data-chip]').forEach(el=>el.addEventListener('dragstart',e=>{selection=el.getAttribute('data-chip');e.dataTransfer.setData('text/plain',selection);e.dataTransfer.effectAllowed='move'}));document.querySelectorAll('[data-slot]').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('active')});el.addEventListener('dragleave',()=>el.classList.remove('active'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('active');assign(Number(el.dataset.slot),e.dataTransfer.getData('text/plain'))})})}
function assign(slot,value){let q=questions[current],bank=q.type==='fill'?q.bank:q.pairs.map(p=>p[1]);if(!bank.includes(value))return;for(let key of Object.keys(assignments))if(assignments[key]===value)delete assignments[key];assignments[slot]=value;selection=null;refreshTask()}

function getComplete(q){if(q.type==='choice')return Number.isInteger(answers.choice);if(q.type==='boolean')return q.statements.every((_,i)=>typeof answers[i]==='boolean');if(q.type==='match')return q.pairs.every((_,i)=>!!assignments[i]);if(q.type==='fill')return q.answers.every((_,i)=>!!assignments[i]);return true}
function isCorrect(q){if(q.type==='choice')return answers.choice===q.correct;if(q.type==='boolean')return q.statements.every((s,i)=>answers[i]===s[1]);if(q.type==='match')return q.pairs.every((p,i)=>assignments[i]===p[1]);if(q.type==='fill')return q.answers.every((a,i)=>assignments[i]===a);if(q.type==='sequence')return sequence.join('|')===q.correct.join('|');return false}
function solution(q){if(q.type==='choice')return q.options[q.correct];if(q.type==='boolean')return q.statements.map((s,i)=>`${i+1}) ${s[1]?'Vero':'Falso'}`).join(' • ');if(q.type==='match')return q.pairs.map(p=>p.join(' → ')).join(' • ');if(q.type==='fill')return q.answers.join(' / ');if(q.type==='sequence')return q.correct.map(id=>q.items.find(x=>x[0]===id)[1]).join(' → ');return ''}

 window.scrollTo({top:0,behavior:'smooth'});
}
app.addEventListener('click',e=>{let el=e.target.closest('button');if(!el||el.disabled)return;if(el.dataset.chapter)return selectChapter(el.dataset.chapter);if(el.dataset.action==='home')return intro();if(!activeKey)return;if(el.dataset.action==='restart')return reset();if(el.dataset.action==='check')return check();if(el.dataset.action==='next')return next();if(el.dataset.action==='print')return window.print();if(locked)return;
if(el.hasAttribute('data-choice')){answers.choice=Number(el.dataset.choice);refreshTask();return}
if(el.hasAttribute('data-boolean')){let [id,val]=el.dataset.boolean.split(':');answers[Number(id)]=val==='true';refreshTask();return}
if(el.hasAttribute('data-chip')){let chip=el.dataset.chip;selection=selection===chip?null:chip;refreshTask();return}
if(el.hasAttribute('data-slot')){let pos=Number(el.dataset.slot);if(selection)assign(pos,selection);else if(assignments[pos]){delete assignments[pos];refreshTask()}return}
if(el.hasAttribute('data-move')){let [i,d]=el.dataset.move.split(':').map(Number);if(i+d<0||i+d>=sequence.length)return;let [item]=sequence.splice(i,1);sequence.splice(i+d,0,item);refreshTask();return}
});
document.getElementById('brand-home').addEventListener('click',e=>{e.preventDefault();intro()});
intro();

</script>
